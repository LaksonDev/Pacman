name: Build Unity Project (Development)

on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: unity-cli-build-development
  cancel-in-progress: true

jobs:
  build:
    name: Build WebGL
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      UNITY_NON_INTERACTIVE: "1"
      UNITY_NO_UPDATE_CHECK: "1"
      UNITY_NO_CONSENT_PROMPT: "1"
      UNITY_NO_CRASH_REPORT: "1"
      UNITY_INSTALL_MISSING_TOOLS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-cli-WebGL-${{ hashFiles('Packages/packages-lock.json') }}
          restore-keys: |
            Library-cli-WebGL-

      - name: Read Unity version from project
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'm_EditorVersion: \K\S+' ProjectSettings/ProjectVersion.txt | tr -d '\r')
          CHANGESET=$(grep -oP 'm_EditorVersionWithRevision: \S+ \(\K[0-9a-f]+' ProjectSettings/ProjectVersion.txt | tr -d '\r')
          echo "UNITY_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "UNITY_CHANGESET=$CHANGESET" >> "$GITHUB_ENV"
          echo "Unity $VERSION ($CHANGESET)"

      - name: Install Editor system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libglu1-mesa libnss3 libasound2t64 libxss1 libxtst6 libgbm1 libc6-dev

      - name: Install Unity CLI
        run: |
          set -euo pipefail
          curl -fsSL https://unity.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Unity Editor with WebGL module
        run: |
          set -euo pipefail
          unity --version
          unity install "$UNITY_VERSION" -c "$UNITY_CHANGESET" -m webgl

      - name: Locate Unity Editor binary
        run: |
          set -euo pipefail
          EDITOR_PATH=$(find "$HOME" /opt -type f -name Unity -path "*${UNITY_VERSION}*/Editor/Unity" 2>/dev/null | head -n1)
          test -n "$EDITOR_PATH"
          echo "UNITY_EDITOR_PATH=$EDITOR_PATH" >> "$GITHUB_ENV"
          echo "Editor: $EDITOR_PATH"

      - name: Activate Unity Personal license
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          EDITOR_DIR=$(dirname "$UNITY_EDITOR_PATH")
          find "$EDITOR_DIR" -type f -name 'Unity.Licensing.Client*'
          LICENSING_CLIENT=$(find "$EDITOR_DIR" -type f \( -name 'Unity.Licensing.Client' -o -name 'Unity.Licensing.Client.exe' \) | head -n1)
          test -n "$LICENSING_CLIENT"
          chmod +x "$LICENSING_CLIENT" || true
          echo "UNITY_LICENSING_CLIENT=$LICENSING_CLIENT" >> "$GITHUB_ENV"
          "$LICENSING_CLIENT" --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"

      - name: Build player
        timeout-minutes: 60
        run: |
          set -euo pipefail
          mkdir -p build
          LOG_FILE="$GITHUB_WORKSPACE/unity-build.log"
          : > "$LOG_FILE"
          tail -n +1 -f "$LOG_FILE" &
          TAIL_PID=$!
          set +e
          xvfb-run --auto-servernum "$UNITY_EDITOR_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -activeBuildProfile "Assets/Settings/Build Profiles/Web - Desktop - Release.asset" \
            -build "$GITHUB_WORKSPACE/build/WebGL" \
            -logFile "$LOG_FILE"
          UNITY_EXIT=$?
          set -e
          sleep 3
          kill "$TAIL_PID" 2>/dev/null || true
          exit "$UNITY_EXIT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-WebGL
          path: build/WebGL
          retention-days: 2
          if-no-files-found: error
